name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  # keep aligned with the onnxruntime version expected by
  # github.com/yalue/onnxruntime_go (see its README)
  ONNXRUNTIME_VERSION: "1.31.0"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet (default and e2e tags)
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go vet -tags e2e ./internal/e2e/
      - name: Unit tests
        run: CGO_ENABLED=0 go test ./... -count=1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  cgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install a C compiler and onnxruntime
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang
          curl -fL --retry 4 -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          tar -xzf ort.tgz
      - name: Full CGO build
        env:
          CGO_ENABLED: '1'
          CC: clang
        run: go build ./...
      - name: Engine integration tests
        env:
          CGO_ENABLED: '1'
          CC: clang
          FACE_RECOGNITION_ORT_LIB: ${{ github.workspace }}/onnxruntime-linux-x64-${{ env.ONNXRUNTIME_VERSION }}/lib/libonnxruntime.so
        run: |
          ./scripts/download-models.sh models
          go test -tags integration ./internal/engine/... -count=1 -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg, a C compiler and onnxruntime
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang ffmpeg
          curl -fL --retry 4 -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          tar -xzf ort.tgz
      - name: Run end-to-end tests
        env:
          CGO_ENABLED: '1'
          CC: clang
          FACE_RECOGNITION_MODELS: ${{ github.workspace }}/models
          FACE_RECOGNITION_ORT_LIB: ${{ github.workspace }}/onnxruntime-linux-x64-${{ env.ONNXRUNTIME_VERSION }}/lib/libonnxruntime.so
          FRS_REPO_ROOT: ${{ github.workspace }}
        run: |
          ./scripts/download-models.sh models
          go test -tags e2e ./internal/e2e/ -count=1 -v -timeout 15m

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
